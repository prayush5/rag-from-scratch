services:
  db:
    image: pgvector/pgvector:pg17
    container_name: rag_postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prayush@7797}
      POSTGRES_DB: ${POSTGRES_DB:-rag_db}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER:-postgres} -d $${POSTGRES_DB:-rag_db}",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag_qdrant
    restart: unless-stopped

    ports:
      - "6333:6333"
      - "6334:6334"

    volumes:
      - qdrant_data:/qdrant/storage

  web:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: rag_fastapi
    restart: unless-stopped

    ports:
      - "8000:8000"

    environment:
      # Docker service-to-service connections
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD_URLENCODED:-prayush%407797}@db:5432/${POSTGRES_DB:-rag_db}
      QDRANT_URL: http://qdrant:6333

      # LLM / Embeddings
      GROQ_API_KEY: ${GROQ_API_KEY}
      JINA_API_KEY: ${JINA_API_KEY}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      LLM_MODEL: ${LLM_MODEL}

      # Langfuse
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY}
      LANGFUSE_HOST: ${LANGFUSE_HOST}

      # Guardrail
      LLAMA_GUARD_BASE_URL: ${LLAMA_GUARD_BASE_URL}
      LLAMA_GUARD_API_KEY: ${LLAMA_GUARD_API_KEY}
      LLAMA_GUARD_MODEL: ${LLAMA_GUARD_MODEL}

    depends_on:
      db:
        condition: service_healthy

      qdrant:
        condition: service_started

    volumes:
      - ./data:/app/data
      - ./static:/app/static

volumes:
  postgres_data:
  qdrant_data:
