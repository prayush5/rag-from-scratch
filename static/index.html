<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAG Console</title>
    <style>
      :root {
        --bg: #14161a;
        --surface: #1c1f26;
        --surface-2: #22262f;
        --border: #2a2e37;
        --text: #e8e6e1;
        --text-dim: #8b8f99;
        --accent: #7fb88f;
        --accent-dim: #56795f;
        --gold: #c9a66b;
        --error: #d97757;
        --radius: 10px;
        --mono: "IBM Plex Mono", "JetBrains Mono", Menlo, Consolas, monospace;
        --sans:
          "IBM Plex Sans", -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
      }

      #app {
        display: flex;
        flex-direction: column;
        height: 100vh;
        max-width: 760px;
        margin: 0 auto;
        border-left: 1px solid var(--border);
        border-right: 1px solid var(--border);
      }

      /* ---------- Header ---------- */
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 14px 20px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
        flex-shrink: 0;
      }

      .brand {
        display: flex;
        flex-direction: column;
        gap: 2px;
      }

      .brand .title {
        font-family: var(--mono);
        font-size: 14px;
        letter-spacing: 0.02em;
        color: var(--text);
      }

      .brand .title::before {
        content: "▍";
        color: var(--accent);
        margin-right: 6px;
      }

      .brand .session {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
      }

      #newChatBtn {
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-dim);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 7px 12px;
        cursor: pointer;
        transition:
          border-color 0.15s ease,
          color 0.15s ease;
      }

      #newChatBtn:hover {
        border-color: var(--accent-dim);
        color: var(--accent);
      }

      /* ---------- Message list ---------- */
      #messages {
        flex: 1;
        overflow-y: auto;
        padding: 24px 20px 8px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .empty-state {
        margin: auto;
        text-align: center;
        color: var(--text-dim);
        font-family: var(--mono);
        font-size: 13px;
        max-width: 340px;
        line-height: 1.6;
      }

      .empty-state .glyph {
        font-size: 22px;
        color: var(--accent-dim);
        margin-bottom: 10px;
      }

      .row {
        display: flex;
        width: 100%;
      }

      .row.user {
        justify-content: flex-end;
      }
      .row.assistant {
        justify-content: flex-start;
      }

      .bubble {
        max-width: 82%;
        padding: 11px 14px;
        border-radius: var(--radius);
        line-height: 1.5;
        font-size: 14.5px;
        white-space: pre-wrap;
        word-wrap: break-word;
      }

      .row.user .bubble {
        background: var(--surface-2);
        color: var(--text);
        border: 1px solid var(--border);
        border-bottom-right-radius: 3px;
      }

      .row.assistant .bubble-wrap {
        max-width: 88%;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .row.assistant .bubble {
        background: var(--surface);
        border: 1px solid var(--border);
        border-bottom-left-radius: 3px;
      }

      .row.error .bubble {
        background: rgba(217, 119, 87, 0.1);
        border: 1px solid var(--error);
        color: var(--error);
        font-family: var(--mono);
        font-size: 12.5px;
      }

      /* ---------- Typing indicator ---------- */
      .typing {
        display: flex;
        gap: 4px;
        padding: 13px 14px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: var(--radius);
        border-bottom-left-radius: 3px;
        width: fit-content;
      }

      .typing span {
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--accent-dim);
        animation: pulse 1.1s infinite ease-in-out;
      }

      .typing span:nth-child(2) {
        animation-delay: 0.15s;
      }
      .typing span:nth-child(3) {
        animation-delay: 0.3s;
      }

      @keyframes pulse {
        0%,
        60%,
        100% {
          opacity: 0.3;
          transform: translateY(0);
        }
        30% {
          opacity: 1;
          transform: translateY(-2px);
        }
      }

      /* ---------- Citation chips ---------- */
      .citations {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .chip {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--gold);
        background: rgba(201, 166, 107, 0.08);
        border: 1px solid rgba(201, 166, 107, 0.35);
        border-radius: 5px;
        padding: 4px 8px;
        cursor: pointer;
        transition: background 0.15s ease;
        max-width: 220px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .chip:hover {
        background: rgba(201, 166, 107, 0.16);
      }

      .chip::before {
        content: "§ ";
        opacity: 0.6;
      }

      details.context-card {
        border: 1px dashed var(--border);
        border-radius: 6px;
        background: var(--surface-2);
      }

      details.context-card summary {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--text-dim);
        padding: 8px 10px;
        cursor: pointer;
        list-style: none;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      details.context-card summary::-webkit-details-marker {
        display: none;
      }

      details.context-card summary::before {
        content: "▸";
        display: inline-block;
        transition: transform 0.15s ease;
      }

      details.context-card[open] summary::before {
        transform: rotate(90deg);
      }

      details.context-card .context-body {
        padding: 0 10px 10px 10px;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-dim);
        line-height: 1.6;
        white-space: pre-wrap;
        max-height: 220px;
        overflow-y: auto;
        border-top: 1px solid var(--border);
        padding-top: 8px;
        margin-top: -2px;
      }

      /* ---------- Composer ---------- */
      #composer {
        flex-shrink: 0;
        border-top: 1px solid var(--border);
        background: var(--surface);
        padding: 14px 20px 18px;
      }

      #composerForm {
        display: block;
      }

      #inputWrap {
        position: relative;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        transition: border-color 0.15s ease;
      }

      #inputWrap:focus-within {
        border-color: var(--accent-dim);
      }

      #questionInput {
        display: block;
        width: 100%;
        resize: none;
        background: transparent;
        border: none;
        color: var(--text);
        font-family: var(--sans);
        font-size: 14px;
        padding: 12px 48px 12px 13px;
        min-height: 44px;
        max-height: 140px;
        line-height: 1.4;
        scrollbar-width: none;
        -ms-overflow-style: none;
      }

      #questionInput:focus {
        outline: none;
      }

      #questionInput::placeholder {
        color: var(--text-dim);
      }

      #questionInput::-webkit-scrollbar {
        display: none;
      }

      #sendBtn {
        position: absolute;
        right: 8px;
        bottom: 6px;
        background: var(--accent);
        color: #16221a;
        border: none;
        border-radius: 8px;
        width: 32px;
        height: 32px;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: opacity 0.15s ease, transform 0.15s ease;
        flex-shrink: 0;
      }

      #sendBtn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }

      #sendBtn:not(:disabled):hover {
        opacity: 0.85;
      }

      #sendBtn:not(:disabled):active {
        transform: scale(0.92);
      }

      #messages::-webkit-scrollbar,
      .context-body::-webkit-scrollbar {
        width: 6px;
      }
      #messages::-webkit-scrollbar-thumb,
      .context-body::-webkit-scrollbar-thumb {
        background: var(--border);
        border-radius: 3px;
      }

      .stream-chunk {
        opacity: 0;
        animation: fadeIn 0.3s ease forwards;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(2px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="app">
      <header>
        <div class="brand">
          <div class="title">rag-console</div>
          <div class="session" id="sessionLabel">session · new</div>
        </div>
        <button id="newChatBtn">↻ New chat</button>
      </header>

      <div id="messages">
        <div class="empty-state" id="emptyState">
          <div class="glyph">◌</div>
          Ask a question about your indexed markdown docs.<br />
          Answers are grounded in retrieved chunks — sources shown below each
          reply.
        </div>
      </div>

      <div id="composer">
        <form id="composerForm">
          <div id="inputWrap">
            <textarea
              id="questionInput"
              rows="1"
              placeholder="Ask something..."
              autofocus
            ></textarea>
            <button id="sendBtn" type="submit" aria-label="Send message">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 19V5M12 5L5 12M12 5L19 12" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </div>

    <script>
      (function () {
        "use strict";

        const API_URL = "/api/v1/chat/stream";
        const STORAGE_KEY = "rag_session_id";

        let sessionId = localStorage.getItem(STORAGE_KEY) || null;
        let isSending = false;

        const messagesEl = document.getElementById("messages");
        const emptyStateEl = document.getElementById("emptyState");
        const formEl = document.getElementById("composerForm");
        const inputEl = document.getElementById("questionInput");
        const sendBtnEl = document.getElementById("sendBtn");
        const sessionLabelEl = document.getElementById("sessionLabel");
        const newChatBtnEl = document.getElementById("newChatBtn");

        function updateSessionLabel() {
          sessionLabelEl.textContent = sessionId
            ? "session · " + sessionId.slice(0, 8)
            : "session · new";
        }

        function scrollToBottom() {
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function hideEmptyState() {
          if (emptyStateEl) emptyStateEl.style.display = "none";
        }

        function autoGrow() {
          inputEl.style.height = "auto";
          inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
        }

        function appendUserMessage(question) {
          hideEmptyState();
          const row = document.createElement("div");
          row.className = "row user";
          row.innerHTML = `<div class="bubble"></div>`;
          row.querySelector(".bubble").textContent = question;
          messagesEl.appendChild(row);
          scrollToBottom();
        }

        function createSmoothRenderer(bubbleEl, wordsPerTick = 1, tickMs = 60) {
          let queue = [];
          let leftover = "";
          let timerId = null;
          let streamEnded = false;
          let resolveDone = null;
          const donePromise = new Promise((resolve) => { resolveDone = resolve; });

          function tick() {
            if (queue.length === 0) {
              timerId = null;
              if (streamEnded) resolveDone();
              return;
            }
            const chunk = queue.splice(0, wordsPerTick).join("");
            const span = document.createElement("span");
            span.className = "stream-chunk";
            span.textContent = chunk;
            bubbleEl.appendChild(span);
            scrollToBottom();
            timerId = setTimeout(tick, tickMs);
          }

          return {
            push(text) {
              const combined = leftover + text;
              const tokens = combined.match(/\S+\s*|\s+/g) || [];
              if (tokens.length > 0 && !/\s$/.test(combined)) {
                leftover = tokens.pop();
              } else {
                leftover = "";
              }
              queue.push(...tokens);
              if (timerId === null) tick();
            },
            end() {
              streamEnded = true;
              if (leftover) {
                queue.push(leftover);
                leftover = "";
              }
              if (queue.length === 0 && timerId === null) resolveDone();
            },
            waitUntilDone() {
              return donePromise;
            }
          };
        }

        function appendTypingIndicator() {
          const row = document.createElement("div");
          row.className = "row assistant";
          row.id = "typingRow";
          row.innerHTML = `
      <div class="typing"><span></span><span></span><span></span></div>
    `;
          messagesEl.appendChild(row);
          scrollToBottom();
          return row;
        }

        function removeTypingIndicator() {
          const el = document.getElementById("typingRow");
          if (el) el.remove();
        }

        function createStreamingAssistantRow() {
          hideEmptyState();

          const row = document.createElement("div");
          row.className = "row assistant";

          const wrap = document.createElement("div");
          wrap.className = "bubble-wrap";

          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.textContent = "";

          const citations = document.createElement("div");
          citations.className = "citations";

          wrap.appendChild(bubble);
          wrap.appendChild(citations);
          row.appendChild(wrap);
          messagesEl.appendChild(row);
          scrollToBottom();

          return {
            bubble, citations
          };

        }

        function appendAssistantMessage(data) {
          hideEmptyState();
          const row = document.createElement("div");
          row.className = "row assistant";

          const wrap = document.createElement("div");
          wrap.className = "bubble-wrap";

          const bubble = document.createElement("div");
          bubble.className = "bubble";
          bubble.textContent = data.answer || "(no answer returned)";
          wrap.appendChild(bubble);

          // Sources as citation chips
          const sources = Array.isArray(data.sources) ? data.sources : [];
          if (sources.length > 0) {
            const citations = document.createElement("div");
            citations.className = "citations";
            sources.forEach(function (src) {
              const chip = document.createElement("span");
              chip.className = "chip";
              chip.textContent = src;
              chip.title = src;
              citations.appendChild(chip);
            });
            wrap.appendChild(citations);
          }

          // Raw context, collapsible
          if (data.context) {
            const details = document.createElement("details");
            details.className = "context-card";
            const summary = document.createElement("summary");
            summary.textContent = "retrieved context";
            const body = document.createElement("div");
            body.className = "context-body";
            body.textContent = data.context;
            details.appendChild(summary);
            details.appendChild(body);
            wrap.appendChild(details);
          }

          row.appendChild(wrap);
          messagesEl.appendChild(row);
          scrollToBottom();
        }

        function appendErrorMessage(message) {
          hideEmptyState();
          const row = document.createElement("div");
          row.className = "row error";
          row.innerHTML = `<div class="bubble"></div>`;
          row.querySelector(".bubble").textContent = "⚠ " + message;
          messagesEl.appendChild(row);
          scrollToBottom();
        }

        function setSending(state) {
          isSending = state;
          sendBtnEl.disabled = state;
          inputEl.disabled = state;
        }

        // ---------- Core: send message ----------
        async function sendQuestion(question) {
          setSending(true);
          appendUserMessage(question);
          appendTypingIndicator();

          const payload = {
            question: question,
            session_id: sessionId,
          };

          let assistantRowCreated = false;
          let bubble = null;
          let citations = null;
          let renderer = null;

          try {
            const response = await fetch(API_URL, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify(payload),
            });

            if (!response.ok) {
              removeTypingIndicator();
              let detail = "";
              try {
                const errJson = await response.json();
                detail = errJson.detail || JSON.stringify(errJson);
              } catch (_) {
                detail = response.statusText;
              }
              appendErrorMessage(
                "Request failed (" + response.status + "). " + detail,
              );
              return;
            }

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
              const { done, value } = await reader.read();
              console.log("reader.read() ->", { done, valueLen: value?.length });
              if (done) break;

              buffer += decoder.decode(value, { stream: true });
              const parts = buffer.split("\n\n");
              buffer = parts.pop(); // Retain incomplete fragment

              for (const part of parts) {
                if (part.startsWith("data: ")) {
                  const data = JSON.parse(part.replace("data: ", ""));

                  // Lazy-init: Replace typing dots only when first data event arrives
                  if (!assistantRowCreated) {
                    removeTypingIndicator();
                    const rowObj = createStreamingAssistantRow();
                    bubble = rowObj.bubble;
                    citations = rowObj.citations;
                    renderer = createSmoothRenderer(bubble, 1, 55)
                    assistantRowCreated = true;
                  }

                  if (data.type === "token") {
                    renderer.push(data.content);
                  } else if (data.type === "metadata") {
                    if (data.session_id) {
                      sessionId = data.session_id;
                      localStorage.setItem(STORAGE_KEY, sessionId);
                      updateSessionLabel();
                    }
                    if (Array.isArray(data.sources)) {
                      data.sources.forEach(function (src) {
                        const chip = document.createElement("span");
                        chip.className = "chip";
                        chip.textContent = src;
                        chip.title = src;
                        citations.appendChild(chip);
                      });
                    }
                  }
                }
              }
            }
          } catch (err) {
            removeTypingIndicator();
            appendErrorMessage(
              "Network error — could not reach " +
                API_URL +
                ". Is the backend running?",
            );
            console.error(err);
          } finally {
            if (renderer) {
              renderer.end();
              await renderer.waitUntilDone();
            }
            setSending(false);
            inputEl.focus();
          }
        }

        // ---------- Event wiring ----------
        formEl.addEventListener("submit", function (e) {
          e.preventDefault();
          if (isSending) return;
          const question = inputEl.value.trim();
          if (!question) return;
          inputEl.value = "";
          autoGrow();
          sendQuestion(question);
        });

        inputEl.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            formEl.requestSubmit();
          }
        });

        inputEl.addEventListener("input", autoGrow);

        newChatBtnEl.addEventListener("click", function () {
          sessionId = null;
          localStorage.removeItem(STORAGE_KEY);
          updateSessionLabel();
          messagesEl.innerHTML = "";
          const fresh = document.createElement("div");
          fresh.className = "empty-state";
          fresh.id = "emptyState";
          fresh.innerHTML = `
      <div class="glyph">◌</div>
      Ask a question about your indexed markdown docs.<br>
      Answers are grounded in retrieved chunks — sources shown below each reply.
    `;
          messagesEl.appendChild(fresh);
          inputEl.focus();
        });

        updateSessionLabel();
      })();
    </script>
  </body>
</html>
