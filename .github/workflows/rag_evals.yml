name: RAG Evaluation Suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: .
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
      LLM_MODEL: "openai/gpt-oss-120b"
      EMBEDDING_MODEL: "BAAI/bge-base-en-v1.5"
      EMBEDDING_DIM: "768"
      DATABASE_URL: "postgresql+asyncpg://ci:ci@localhost:5432/ci"
      QDRANT_URL: "http://localhost:6333"
      ADMIN_SECRET: ${{ secrets.ADMIN_SECRET }}
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: "https://cloud.langfuse.com"
      EVAL_LLM_PROVIDER: "ollama"
      EVAL_LLM_MODEL: "llama3.2:1b"
      OLLAMA_BASE_URL: "http://localhost:11434"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Setup Ollama
        uses: ai-action/setup-ollama@v2

      - name: Pull Ollama Model
        run: ollama pull llama3.2:1b

      - name: Verify Ollama is reachable
        run: |
          curl -sf http://localhost:11434/api/tags || (echo "Ollama not responding" && exit 1)

      - name: Ingest Test Corpus
        run: python -m app.scripts.ingest_docs

      - name: Run DeepEval Regression Test
        run: python -m app.scripts.run_eval
